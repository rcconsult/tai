[package]
name = "tai"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
# Exact pin: the crate's bindings are generated against one Ghostty commit,
# which scripts/fetch-ghostty.sh must match (ADR 0001).
libghostty-vt = { version = "=0.2.2", features = ["tracing"] }
# Keep the `audio` feature off: it needs libasound2-dev on Linux and tai has no sound.
macroquad = { version = "0.4.14", default-features = false }
# Glyph coverage checks for font fallback. Same version macroquad uses.
fontdue = "0.9.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["term", "fs", "signal", "process", "user", "ioctl"] }

# ConPTY on Windows (ADR 0002).
[target.'cfg(windows)'.dependencies]
portable-pty = "0.9.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_LibraryLoader"] }

# miniquad's macOS clipboard is a stub (get returns None, set does nothing),
# so macOS uses arboard. Text only: no image support.
[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3.7.0", default-features = false }

# Vendored macroquad with a clipboard fix; see vendor/macroquad/TAI-PATCHES.md.
[patch.crates-io]
macroquad = { path = "vendor/macroquad" }

# Optimize dependencies in dev builds. fontdue parses every glyph of a
# font eagerly (much of it in ttf-parser), and each font-size step reloads
# all fonts: unoptimized, the three bundled fonts took ~1.1 s per step on
# Windows, ~0.3 s with this, ~0.15 s in release (issue #2). tai's own code
# stays unoptimized, so its rebuilds stay quick.
[profile.dev.package."*"]
opt-level = 3
