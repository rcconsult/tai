[package]
name = "tai"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
# Exact pin: the crate's bindings are generated against one Ghostty commit,
# which scripts/fetch-ghostty.sh must match (ADR 0001).
libghostty-vt = { version = "=0.2.2", features = ["tracing"] }
# Keep the `audio` feature off: it needs libasound2-dev on Linux and tai has no sound.
macroquad = { version = "0.4.14", default-features = false }
# Fonts read in place and glyph outlines filled on first use (ADR 0012).
# skrifa 0.44.0 is the version epaint 0.36 uses, so tai-gui builds it once.
skrifa = "0.44.0"
zeno = "0.3.3"
# Sixel decoding, for translating Sixel into Kitty images (ADR 0006).
icy_sixel = "0.7.0"
tracing = "0.1.44"
# Grapheme clusters, for the selection badge's character count.
unicode-segmentation = "1.12.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The egui prototype (ADR 0011), behind the `gui` feature so the macroquad
# build stays as it is. egui_dock 0.21 needs egui 0.36.
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"], optional = true }
egui_dock = { version = "0.21.1", optional = true }
# The engine client (ADR 0010): plain HTTP to ppxai-server on loopback, so
# no TLS. =3.4.2 because 3.4.3 and 3.5.0 are under two weeks old.
ureq = { version = "=3.4.2", default-features = false, optional = true }
serde_json = { version = "1.0.154", optional = true }
getrandom = { version = "0.4.3", optional = true }
# Markdown in the chat pane, with syntect code highlighting (ADR 0011).
egui_commonmark = { version = "0.25.0", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting"], optional = true }

[features]
gui = [
    "dep:eframe",
    "dep:egui_dock",
    "dep:ureq",
    "dep:serde_json",
    "dep:getrandom",
    "dep:egui_commonmark",
    # The engine's job object (src/bin/tai-gui/engine.rs).
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_System_Diagnostics_ToolHelp",
    "windows-sys/Win32_System_JobObjects",
    "windows-sys/Win32_System_Threading",
]

[[bin]]
name = "tai"
path = "src/main.rs"

[[bin]]
name = "tai-gui"
path = "src/bin/tai-gui/main.rs"
required-features = ["gui"]

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["term", "fs", "signal", "process", "user", "ioctl"] }

# ConPTY on Windows (ADR 0002).
[target.'cfg(windows)'.dependencies]
portable-pty = "0.9.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_LibraryLoader"] }

# miniquad's macOS clipboard is a stub (get returns None, set does nothing),
# so macOS uses arboard. Text only: no image support.
[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3.7.0", default-features = false }

# Vendored macroquad with a clipboard fix; see vendor/macroquad/TAI-PATCHES.md.
[patch.crates-io]
macroquad = { path = "vendor/macroquad" }

# Optimize dependencies in dev builds. Font parsing and glyph rasterizing
# live in dependencies: when tai used fontdue, a font-size step took ~1.1 s
# on Windows unoptimized, ~0.3 s with this, ~0.15 s in release (issue #2).
# tai's own code stays unoptimized, so its rebuilds stay quick.
[profile.dev.package."*"]
opt-level = 3
